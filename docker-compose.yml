services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: codemate-backend
    env_file:
      - ./backend/.env
    ports:
      - "5001:5001"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        REACT_APP_BACKEND_URL: http://backend:5001
    container_name: codemate-frontend
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
